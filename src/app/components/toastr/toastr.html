<div class="fixed top-4 right-4 z-[9999] flex flex-col gap-3 w-full max-w-sm pointer-events-none">
  <div
    class="pointer-events-auto relative overflow-hidden bg-gray-900/90 backdrop-blur-md border-l-4 rounded-r-lg p-4 shadow-xl transform transition-all duration-300 hover:scale-105 group"
    [ngClass]="{
      'border-green-500 shadow-green-500/20': type === 'success',
      'border-red-500 shadow-red-500/20': type === 'error',
      'border-[var(--color-primary)] shadow-[var(--color-primary)]/20': type === 'info'
    }"
  >
    <div class="absolute inset-0 opacity-10 pointer-events-none bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>

    <div class="flex items-start space-x-4 relative z-10">
      <div class="flex-shrink-0 mt-1">
        @if (type === 'success') {
        <svg class="w-6 h-6 text-green-400 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        } @if (type === 'error') {
        <svg class="w-6 h-6 text-red-400 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        } @if (type === 'info') {
        <svg class="w-6 h-6 text-[var(--color-primary)] animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        }
      </div>

      <div class="flex-1 pt-0.5">
        <h3
          class="font-orbitron text-sm font-bold tracking-wider uppercase mb-1"
          [ngClass]="{
            'text-green-400': type === 'success',
            'text-red-400': type === 'error',
            'text-[var(--color-primary)]': type === 'info'
          }"
        >
          {{ title }}
        </h3>
        <p class="text-gray-300 text-sm leading-relaxed font-sans opacity-90">
          {{ message }}
        </p>
      </div>
    </div>

    <div class="absolute bottom-0 left-0 h-0.5 bg-white/20 w-full">
      <div
        class="h-full w-full origin-left animate-shrink"
        (animationend)="close()"
        [ngClass]="{
          'bg-green-500': type === 'success',
          'bg-red-500': type === 'error',
          'bg-[var(--color-primary)]': type === 'info'
        }"
      ></div>
    </div>
  </div>
</div>

<div
  class="host-container"
  style="
    background-image: url('https://images.unsplash.com/photo-1543782207-6c84c20b8527?q=80&w=2500&auto-format&fit=crop');
  "
>
  <div class="absolute inset-0 bg-black opacity-70"></div>
  <div class="scanline-overlay"></div>
  <div class="web-pattern-overlay"></div>

  <main
    class="relative w-full max-w-md bg-gray-900/80 backdrop-blur-sm border-2 border-[var(--color-primary)]/40 rounded-lg p-6 sm:p-8 shadow-2xl shadow-[rgba(var(--color-primary-rgb),0.2)]"
  >
    <div class="corner-bracket top-left"></div>
    <div class="corner-bracket top-right"></div>
    <div class="corner-bracket bottom-left"></div>
    <div class="corner-bracket bottom-right"></div>

    <header class="text-center mb-8">
      <h1 class="font-orbitron text-3xl sm:text-4xl glitch" data-text="[ WEB_ACCESS ]">
        [ WEB_ACCESS ]
      </h1>
      <p class="text-white/70 mt-2 text-sm">// IDENTITY_SCAN REQUIRED</p>
    </header>

    <form>
      <div class="mb-6">
        <label
          for="username"
          class="flex items-center text-sm font-medium text-[var(--color-primary)]/90 mb-2"
        >
          <span>CALLSIGN / ID</span>
          <span class="blinking-caret-label"></span>
        </label>
        <input
          type="text"
          id="username"
          placeholder="// Enter Alias or Fingerprint ID"
          class="form-input w-full bg-gray-800/70 border-2 border-[var(--color-primary)]/30 rounded-md px-4 py-2 text-gray-100 placeholder-gray-400 transition duration-300 focus:outline-none"
        />
      </div>

      <div class="mb-8">
        <label
          for="password"
          class="flex items-center text-sm font-medium text-[var(--color-primary)]/90 mb-2"
        >
          <span>BIO_KEY</span>
          <span class="blinking-caret-label"></span>
        </label>
        <input
          type="password"
          id="password"
          placeholder="••••••••••••"
          class="form-input w-full bg-gray-800/70 border-2 border-[var(--color-primary)]/30 rounded-md px-4 py-2 text-gray-100 placeholder-gray-400 transition duration-300 focus:outline-none"
        />
      </div>

      <button
        type="submit"
        class="w-full cursor-pointer bg-[var(--color-primary)] text-white font-bold py-3 rounded-md transition-all duration-300 hover:bg-[var(--color-primary-dark)] hover:shadow-lg hover:shadow-[rgba(var(--color-primary-rgb),0.5)] transform hover:-translate-y-1 active:translate-y-0"
      >
        [ INITIATE SWING ]
      </button>
    </form>

    <div class="flex items-center my-6">
      <hr class="flex-grow border-[var(--color-primary)]/30" />
      <span class="px-4 text-xs text-white/50 whitespace-nowrap">// SYNC_ACCOUNTS</span>
      <hr class="flex-grow border-[var(--color-primary)]/30" />
    </div>

    <div class="flex justify-center space-x-4">
      <button
        class="p-2 cursor-pointer border-2 border-[var(--color-secondary)]/50 rounded-full hover:bg-[var(--color-secondary)]/20 hover:border-[var(--color-secondary)] transition-all duration-300"
        aria-label="Login with Google"
      >
        <svg
          class="w-6 h-6 text-[var(--color-secondary)]"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 48 48"
        >
          <path
            fill="#FFC107"
            d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"
          ></path>
          <path
            fill="#FF3D00"
            d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"
          ></path>
          <path
            fill="#4CAF50"
            d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"
          ></path>
          <path
            fill="#1976D2"
            d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.574l6.19,5.238C41.38,36.143,44,30.668,44,24C44,22.659,43.862,21.35,43.611,20.083z"
          ></path>
        </svg>
      </button>
    </div>

    <footer class="text-center mt-8">
      <div class="text-xs text-[var(--color-primary)]/60 inline-flex items-center mb-4">
        <span class="status-text-content">// SYSTEM: AWAITING_ID_VERIFICATION...</span>
        <span class="blinking-caret-standalone"></span>
      </div>
      <div>
        <a
          href="#"
          class="text-sm text-white/60 border-b border-dotted border-white/40 hover:text-white hover:border-solid hover:border-white transition-all duration-300"
        >
          New Recruit? &gt;&gt; INITIATE_REGISTRATION
        </a>
      </div>
    </footer>
  </main>
</div>
